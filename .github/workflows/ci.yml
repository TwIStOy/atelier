name: CI

# Skip directives in the commit message ([skip ci], [ci skip], [no ci],
# [skip actions], [actions skip]) are honored natively by GitHub Actions.
on:
  push:
    branches: [master]
    paths-ignore: &non-code-paths
      - 'docs/**'
      - 'scripts/**'
      - 'skills/**'
      - 'themes/**'
      - 'prompts/**'
      - '.agents/**'
      - '**/*.md'
      - 'justfile'
  pull_request:
    branches: [master]
    paths-ignore: *non-code-paths

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & Format
        run: npm run check

      - name: Typecheck (tsc --build)
        run: npx tsc --build

      - name: Test
        run: npm test
